name: terraform-yaml-pipline example build
trigger:
  branches:
    include:
    - master
    - develop    
pool:
  vmImage: 'Ubuntu 16.04'
steps:
- task: AzureCLI@1
  inputs:
    azureSubscription: '<yoursub>'
    scriptPath: plan.sh
    addSpnToEnvironment: true
  env:
    ARM_STORAGE_ACCOUNT_NAME: "TformStatestorage"
    ARM_STORAGE_CONTAINER: "terraform-state"
    ARM_STORAGE_KEY: "dev.tfstate"